# TEMPORARY: exercises the macOS sign + notarize step of .goreleaser.yml
# without tagging or publishing anything. Delete before merging.
name: Test Notarize (Temporary)
permissions: {} # yamllint disable-line rule:braces

on:
  # workflow_dispatch alone cannot be triggered until the file is on the default branch
  push:
    branches:
      - chore/notarize
  workflow_dispatch:

jobs:
  test-notarize:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      # Checkout code from repo
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: "0"

      # Install Go
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      # Snapshot mode skips notarization, so fake a release on a local-only tag instead
      - name: Create local test tag
        run: git tag v0.0.0-notarize-test

      # Wait for Apple's verdict so a rejection fails this job (test-only; real releases unchanged)
      - name: Enable notarization wait
        run: |
          set -euo pipefail
          perl -0pi -e 's/^(\s+)wait: false$/$1wait: true\n$1timeout: 20m/m or die "wait: false not found\n"' .goreleaser.yml
          grep -n -A1 'wait:' .goreleaser.yml

      # Real (non-snapshot) build: signs and notarizes darwin binaries, publishes nothing
      - name: Run GoReleaser (no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --skip=publish,announce,validate
        env:
          GORELEASER_CURRENT_TAG: v0.0.0-notarize-test
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 0.0.0-notarize-test
          PERSONAL_ACCESS_TOKEN: unused-with-skip-publish
          NO_CREATE_CHANGELOG: true
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }} # zizmor: ignore[secrets-outside-env]
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }} # zizmor: ignore[secrets-outside-env]
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }} # zizmor: ignore[secrets-outside-env]
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }} # zizmor: ignore[secrets-outside-env]
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }} # zizmor: ignore[secrets-outside-env]

      # Confirm the darwin binaries carry a Developer ID signature with hardened runtime
      - name: Verify signatures
        run: |
          set -euo pipefail
          found=0
          for bin in $(find dist -path '*darwin*' -type f -name tfswitch); do
            found=1
            echo "::group::${bin}"
            codesign --verify --strict --verbose=2 "${bin}"
            # Capture first: grep -q exits on first match, SIGPIPEs the writer, and pipefail fails the step
            info="$(codesign --display --verbose=4 "${bin}" 2>&1)"
            echo "${info}"
            grep -q "Authority=Developer ID Application" <<< "${info}"
            grep -q "flags=.*runtime" <<< "${info}"
            case "${bin}" in *arm64*) "${bin}" --version ;; esac # runner is arm64
            echo "::endgroup::"
          done
          if [ "${found}" -eq 0 ]; then
            echo "No darwin binaries found in dist/"
            exit 1
          fi
